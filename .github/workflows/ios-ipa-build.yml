name: iOS-ipa-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自动取最新 tag）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project "Live OS/Live OS.xcodeproj" \
            -scheme "Live OS" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Live OS.app"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry LiveOS.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveOS-unsigned-ipa
          path: build/ipa/LiveOS.ipa

      - name: Read release notes
        id: notes
        run: |
          if [[ -f RELEASE_NOTES.md ]]; then
            {
              echo "body<<NOTES_EOF"
              cat RELEASE_NOTES.md
              echo ""
              echo "NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<NOTES_EOF"
              echo "> Unsigned IPA，需通过 AltStore / Sideloadly / 企业证书安装"
              echo "NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ipa/LiveOS.ipa
          tag: ${{ steps.tag.outputs.tag }}
          overwrite: true
          body: ${{ steps.notes.outputs.body }}
