name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project "Live OS/Live OS.xcodeproj" \
            -scheme "Live OS" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Live OS.app"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry LiveOS.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveOS-unsigned-ipa
          path: build/ipa/LiveOS.ipa

      - name: Upload IPA to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ipa/LiveOS.ipa
          tag: v1.2
          overwrite: true
          body: |
            ## v1.2 更新内容

            - ✨ 新增：品牌冷启动动效，双图标合并 + 闪电劈落特效
            - 📷 新增：缩略图本地会话缓存，减少重复请求服务端
            - 💾 新增：设置页存储管理，查看缓存占用与一键清除
            - 🎚️ 修复：左右滑动调整播放进度不同步的问题
            - 🖼️ 修复：横屏直播间缩略图撑破布局的问题
            - ▶️ 修复：首次播放仅显示第一帧且页面被放大的问题

            > Unsigned IPA，需通过 AltStore / Sideloadly / 企业证书安装
